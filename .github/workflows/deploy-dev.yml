# develop -> publica a stack financas-dev (back e front) sem aprovacao e, se der certo, abre (ou atualiza) o PR de release.
name: Deploy dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      ambiente: dev

  # Depois de um deploy do dev bem-sucedido, abre o PR develop -> main (se nao houver um) e comenta a proxima versao.
  # Exige ligar "Allow GitHub Actions to create and approve pull requests" (Settings > Actions > General).
  pr-release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Abrir o PR de release
        run: bash scripts/pr-release.sh criar
