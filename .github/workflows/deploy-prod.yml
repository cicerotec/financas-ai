# main -> publica a stack financas (producao). O environment `prod` exige aprovacao manual antes de o job rodar.
# Depois do deploy, cria a tag anotada e a release no GitHub (a tag marca o que foi para producao).
name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      ambiente: prod

  lancar-versao:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Criar a tag e a release
        run: bash scripts/criar-tag-release.sh
