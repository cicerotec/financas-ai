# Validacao de PR (develop e main) e de push nas branches de trabalho: testes do Go e `sam validate --lint`. Nao usa credenciais da AWS nem publica nada.
name: CI

on:
  pull_request:
    branches: [develop, main]
  # PR criado pelo Actions (GITHUB_TOKEN) nao dispara o evento de PR; o push garante o CI nas branches de trabalho e,
  # na develop, o resultado aparece no PR de release.
  push:
    branches: ['feature/**', 'fix/**', 'bug/**', 'docs/**', 'chore/**', develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Testes do Go
        working-directory: backend
        run: |
          go vet ./...
          go test ./...
      - name: Testes do front (logica de repeticao dos eventos futuros)
        run: node web/recorrencia.test.js
      - name: sam validate --lint
        run: sam validate --lint --region sa-east-1
