# Validacao do push nas branches de trabalho e na develop: testes do Go, do front e `sam validate --lint`. Nao usa credenciais da AWS nem publica nada.
name: CI

# So `push`, de proposito: os PRs sao criados pelo robo (GITHUB_TOKEN), e o run de `pull_request` de um PR de robo fica
# parado em "Approve and run" (vermelho, sem nada a aprovar). O check do push ja aparece no PR, ligado ao mesmo commit:
# o PR da branch mostra o CI da branch e o PR de release (develop -> main) mostra o CI da develop.
on:
  push:
    branches: ['feature/**', 'fix/**', 'bug/**', 'docs/**', 'chore/**', 'hotfix/**', develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Testes do Go
        working-directory: backend
        run: |
          go vet ./...
          go test ./...
      - name: Testes do front (logica de repeticao dos eventos futuros)
        run: node web/recorrencia.test.js
      - name: Testes do front (tela Historico de versoes)
        run: node web/versoes.test.js
      - name: Testes do front (confirmacao de mes fechado)
        run: node web/confirmacao.test.js
      - name: Testes do front (conta no menu)
        run: node web/usuario.test.js
      - name: Testes do front (consulta por tags de Tendencias)
        run: node web/consulta-tags.test.js
      - name: Testes do front (botao voltar do navegador)
        run: node web/voltar.test.js
      - name: sam validate --lint
        run: sam validate --lint --region sa-east-1
