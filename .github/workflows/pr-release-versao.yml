# Mantem o comentario "Proxima versao" do PR de release (develop -> main) atualizado quando o rotulo ou os commits mudam.
# A criacao do PR e do primeiro comentario fica no deploy-dev.yml (PR criado com o GITHUB_TOKEN nao dispara este workflow).
name: Versao do PR de release

on:
  pull_request:
    types: [synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: versao-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comentar:
    if: github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Atualizar o comentario da versao
        run: bash scripts/pr-release.sh comentar "${{ github.event.pull_request.number }}"
