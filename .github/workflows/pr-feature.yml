# Push numa branch de trabalho (feature/, fix/, bug/, docs/ ou chore/) abre o PR para a develop, ja pronto para mergear,
# se ainda nao houver um. Exige ligar, em Settings > Actions > General:
# "Allow GitHub Actions to create and approve pull requests".
name: PR da branch

on:
  push:
    branches: ['feature/**', 'fix/**', 'bug/**', 'docs/**', 'chore/**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-branch-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  abrir-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Abrir o PR (rascunho) para a develop
        run: bash scripts/pr-feature.sh
