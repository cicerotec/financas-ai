AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Financas - DynamoDB + Cognito + Lambda (Go) com Function URL + front em S3/CloudFront

Parameters:
  FrontOrigin:
    Type: String
    Default: http://localhost:8080
    Description: Origem do front para desenvolvimento local (CORS e callback do login). Sem barra no final. O endereco do CloudFront e acrescentado automaticamente.
  CognitoDomainPrefix:
    Type: String
    Description: Prefixo unico do dominio do login (ex. financas-seunome-123)
  ReservedConcurrency:
    Type: Number
    Default: 0
    Description: Teto de execucoes simultaneas da Lambda (limita o estrago de uma enxurrada de requisicoes e a conta). 0 desliga. A conta precisa manter pelo menos 10 execucoes sem reserva; com o limite da conta em 10 so o 0 funciona. Confira com "aws lambda get-account-settings".

Conditions:
  TemTetoDeConcorrencia: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: provided.al2023
    Architectures: [x86_64]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: FinancasApp
      BillingMode: PROVISIONED          # dentro do always-free (25 RCU/WCU)
      ProvisionedThroughput: { ReadCapacityUnits: 5, WriteCapacityUnits: 5 }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: false }

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: financas
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }   # sem auto cadastro: voce convida
      Policies:
        PasswordPolicy: { MinimumLength: 10, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: false }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub '${FrontOrigin}/', !Sub 'https://${Distribution.DomainName}/']
      LogoutURLs: [!Sub '${FrontOrigin}/', !Sub 'https://${Distribution.DomainName}/']
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/financas-api
      RetentionInDays: 14

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    DependsOn: ApiLogs
    Properties:
      FunctionName: financas-api
      CodeUri: backend/
      Handler: bootstrap
      ReservedConcurrentExecutions: !If [TemTetoDeConcorrencia, !Ref ReservedConcurrency, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          USER_POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref UserPoolClient
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      FunctionUrlConfig:
        AuthType: NONE               # o JWT do Cognito e validado dentro da Lambda
        Cors:
          AllowOrigins: [!Ref FrontOrigin, !Sub 'https://${Distribution.DomainName}']
          AllowMethods: [GET, POST, PUT, DELETE]
          AllowHeaders: [authorization, content-type]
          MaxAge: 3600

  # ---------------------------------------------------------------- front (S3 privado + CloudFront)
  FrontBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: financas-front
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: financas front
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All        # inclui borda em Sao Paulo; o custo fica dentro do free tier
        Origins:
          - Id: front
            DomainName: !GetAtt FrontBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: front
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6            # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy

  FrontBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SoOCloudFrontDestaDistribuicaoLe
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${FrontBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  ApiUrl: { Value: !GetAtt ApiFunctionUrl.FunctionUrl }
  UserPoolId: { Value: !Ref UserPool }
  ClientId: { Value: !Ref UserPoolClient }
  LoginDomain: { Value: !Sub '${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com' }
  FrontUrl: { Value: !Sub 'https://${Distribution.DomainName}' }
  FrontBucket: { Value: !Ref FrontBucket }
  DistributionId: { Value: !Ref Distribution }
