<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
    <style>
      .t{font-size:15px;fill:#0f172a;font-weight:600}
      .s{font-size:12.5px;fill:#475569}
      .h{font-size:13px;fill:#64748b;font-weight:700;letter-spacing:1px}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}
      .ln{stroke:#475569;stroke-width:2;fill:none}
      .lo{stroke:#b45309;stroke-width:2;fill:none;stroke-dasharray:7 5}
      .n{fill:#1d4ed8}
      .nt{font-size:13px;fill:#fff;font-weight:700;text-anchor:middle}
      .lb{font-size:12px;fill:#334155;text-anchor:middle}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#0f172a">Finanças da Família — como o sistema funciona</text>
  <text x="40" y="72" class="s">AWS sa-east-1 · front sem build · back em Go · tudo serverless</text>

  <!-- zonas -->
  <rect x="30" y="100" width="260" height="520" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="50" y="125" class="h">PESSOAS</text>
  <rect x="320" y="100" width="1150" height="520" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="340" y="125" class="h">NUVEM AWS</text>
  <rect x="30" y="650" width="1440" height="220" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="50" y="675" class="h">ROTINAS AUTOMÁTICAS E AVISOS (TELEGRAM)</text>

  <!-- pessoas -->
  <rect x="55" y="150" width="210" height="64" rx="10" class="box"/>
  <text x="160" y="177" text-anchor="middle" class="t">Dono (owner)</text>
  <text x="160" y="197" text-anchor="middle" class="s">acesso total</text>
  <rect x="55" y="235" width="210" height="64" rx="10" class="box"/>
  <text x="160" y="262" text-anchor="middle" class="t">Membro (member)</text>
  <text x="160" y="282" text-anchor="middle" class="s">cria; edita só o que criou</text>
  <rect x="55" y="380" width="210" height="130" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="160" y="410" text-anchor="middle" class="t">Navegador / PWA</text>
  <text x="160" y="432" text-anchor="middle" class="s">computador ou celular</text>
  <text x="160" y="452" text-anchor="middle" class="s">index.html + js/app.js</text>
  <text x="160" y="472" text-anchor="middle" class="s">api.js (cliente da API)</text>
  <text x="160" y="492" text-anchor="middle" class="s">cache dos 1000 últimos</text>
  <path class="ln" d="M75 182 H40 V445 H55" marker-end="url(#a)"/>
  <path class="ln" d="M160 299 V380" marker-end="url(#a)"/>

  <!-- front hosting -->
  <rect x="360" y="150" width="190" height="64" rx="10" class="box"/>
  <text x="455" y="177" text-anchor="middle" class="t">CloudFront</text>
  <text x="455" y="197" text-anchor="middle" class="s">HTTPS + cabeçalhos</text>
  <rect x="610" y="150" width="190" height="64" rx="10" class="box"/>
  <text x="705" y="177" text-anchor="middle" class="t">S3 privado</text>
  <text x="705" y="197" text-anchor="middle" class="s">web/ (HTML, CSS, JS)</text>
  <path class="ln" d="M550 182 H610" marker-end="url(#a)"/>

  <!-- cognito -->
  <rect x="360" y="290" width="190" height="64" rx="10" class="box"/>
  <text x="455" y="317" text-anchor="middle" class="t">Cognito</text>
  <text x="455" y="337" text-anchor="middle" class="s">Hosted UI · PKCE · MFA</text>

  <!-- lambda -->
  <rect x="610" y="260" width="500" height="320" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="860" y="290" text-anchor="middle" class="t">Lambda (Go) — Function URL</text>
  <rect x="640" y="310" width="440" height="44" rx="8" class="box"/>
  <text x="860" y="337" text-anchor="middle" class="s"><tspan font-weight="700" fill="#0f172a">auth</tspan> · valida o token e descobre o papel</text>
  <rect x="640" y="372" width="440" height="44" rx="8" class="box"/>
  <text x="860" y="399" text-anchor="middle" class="s"><tspan font-weight="700" fill="#0f172a">controller</tspan> · rotas HTTP e permissão</text>
  <rect x="640" y="434" width="440" height="44" rx="8" class="box"/>
  <text x="860" y="461" text-anchor="middle" class="s"><tspan font-weight="700" fill="#0f172a">service + domain</tspan> · regras (saldo, faturas…)</text>
  <rect x="640" y="496" width="440" height="44" rx="8" class="box"/>
  <text x="860" y="523" text-anchor="middle" class="s"><tspan font-weight="700" fill="#0f172a">repository</tspan> · lê e grava no banco</text>
  <path class="ln" d="M860 354 V372" marker-end="url(#a)"/>
  <path class="ln" d="M860 416 V434" marker-end="url(#a)"/>
  <path class="ln" d="M860 478 V496" marker-end="url(#a)"/>
  <text x="860" y="565" text-anchor="middle" class="s">rotas de rotina e do webhook entram pelo mesmo ponto</text>

  <!-- dynamo -->
  <rect x="1190" y="360" width="250" height="140" rx="10" class="box"/>
  <text x="1315" y="392" text-anchor="middle" class="t">DynamoDB</text>
  <text x="1315" y="414" text-anchor="middle" class="s">tabela FinancasApp (PK + SK)</text>
  <text x="1315" y="436" text-anchor="middle" class="s">lançamentos · config · saldos</text>
  <text x="1315" y="456" text-anchor="middle" class="s">histórico de versões · avisos</text>
  <text x="1315" y="476" text-anchor="middle" class="s">contador seq do espaço</text>
  <path class="ln" d="M1080 518 H1135 V450 H1190" marker-end="url(#a)"/>
  <path class="ln" d="M1190 470 H1160 V538 H1080" marker-end="url(#a)"/>

  <!-- fluxos principais -->
  <path class="ln" d="M265 420 H320 V182 H360" marker-end="url(#a)"/>
  <path class="ln" d="M265 440 H320 V322 H360" marker-end="url(#a)"/>
  <path class="ln" d="M265 480 H610" marker-end="url(#a)"/>
  <path class="ln" d="M550 340 H580 V330 H640" marker-end="url(#a)" opacity="0"/>
  <path class="lo" d="M550 332 H590 V332" opacity="0"/>

  <!-- numeros -->
  <circle cx="340" cy="300" r="12" class="n"/><text x="340" y="305" class="nt">1</text>
  <circle cx="340" cy="190" r="12" class="n"/><text x="340" y="195" class="nt">2</text>
  <circle cx="440" cy="480" r="12" class="n"/><text x="440" y="485" class="nt">3</text>
  <circle cx="1110" cy="420" r="12" class="n"/><text x="1110" y="425" class="nt">4</text>
  <text x="440" y="508" class="lb">token JWT no cabeçalho</text>
  <text x="440" y="396" class="lb" transform="rotate(0)"></text>

  <!-- rotinas -->
  <rect x="60" y="700" width="230" height="64" rx="10" class="box"/>
  <text x="175" y="727" text-anchor="middle" class="t">EventBridge</text>
  <text x="175" y="747" text-anchor="middle" class="s">agenda (cron)</text>
  <rect x="330" y="690" width="290" height="40" rx="8" class="box"/>
  <text x="475" y="715" text-anchor="middle" class="s">todo dia 08:00 · avisos de vencimentos</text>
  <rect x="330" y="740" width="290" height="40" rx="8" class="box"/>
  <text x="475" y="765" text-anchor="middle" class="s">domingo 03:00 · combos sugeridos</text>
  <path class="ln" d="M290 722 H330" marker-end="url(#a)"/>
  <path class="ln" d="M290 740 H310 V760 H330" marker-end="url(#a)"/>
  <path class="ln" d="M620 710 H700 V580" marker-end="url(#a)"/>
  <path class="ln" d="M620 760 H700 V720" />

  <rect x="860" y="700" width="230" height="64" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="975" y="727" text-anchor="middle" class="t">Telegram (bot)</text>
  <text x="975" y="747" text-anchor="middle" class="s">chega no celular do dono</text>
  <path class="lo" d="M975 580 V700" marker-end="url(#g)"/>
  <text x="965" y="650" class="lb" style="text-anchor:end;fill:#b45309">avisa o vencimento</text>
  <rect x="1190" y="700" width="250" height="64" rx="10" class="box"/>
  <text x="1315" y="727" text-anchor="middle" class="t">Vínculo do Telegram</text>
  <text x="1315" y="747" text-anchor="middle" class="s">dono abre o link no bot → grava o chat</text>
  <path class="lo" d="M1315 700 V640 H1050 V580" marker-end="url(#g)"/><text x="1180" y="632" class="lb" style="fill:#b45309">webhook do vínculo</text>
  <path class="lo" d="M1315 700 V620 H1080 V560" marker-end="url(#g)" opacity="0"/>

  <!-- legenda -->
  <rect x="40" y="800" width="1420" height="58" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="56" y="824" class="s"><tspan font-weight="700" fill="#1d4ed8">1</tspan> entra pelo Cognito (login + token) · <tspan font-weight="700" fill="#1d4ed8">2</tspan> baixa o app do CloudFront/S3 · <tspan font-weight="700" fill="#1d4ed8">3</tspan> chama a API com o token · <tspan font-weight="700" fill="#1d4ed8">4</tspan> a Lambda confere o papel, aplica a regra e grava no DynamoDB</text>
  <text x="56" y="846" class="s">Linha cheia: pedido do usuário · Linha tracejada: rotina automática e Telegram · O saldo e as faturas são calculados no servidor; o navegador só exibe.</text>
</svg>
